<footer class="site-footer">
  <div class="wrapper">
    <p>
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank">GitHub</a> &middot;{% endif %}
      {% if site.linkedin_username %}<a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank">LinkedIn</a> &middot;{% endif %}
      {% if site.twitter_username %}<a href="https://twitter.com/{{ site.twitter_username }}" target="_blank">Twitter</a>{% endif %}
    </p>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </div>
</footer>

<script>
  // Append hover-reveal anchor links to post H2s
  document.querySelectorAll('.post-content h2[id]').forEach(function(h2) {
    var link = document.createElement('a');
    link.className = 'anchor-link';
    link.href = '#' + h2.id;
    link.textContent = '#';
    link.title = 'Link to this section';
    h2.appendChild(link);
  });
</script>
